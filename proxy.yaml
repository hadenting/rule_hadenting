# ============================================================
# 域名匹配规则类型对比（适用于 Clash / Surge / Shadowrocket）
# ============================================================
# 规则格式：类型, 目标, 策略
# ============================================================
#
# +------------------+-------------------------------------+-----------------------------------+
# | 规则类型           | 匹配逻辑                            | 示例                               |
# +------------------+-------------------------------------+-----------------------------------+
# | DOMAIN            | 完整域名精确匹配                      | DOMAIN, www.google.com, PROXY     |
# +------------------+-------------------------------------+-----------------------------------+
# | DOMAIN-SUFFIX     | 域名后缀匹配（含所有子域名）           | DOMAIN-SUFFIX, google.com, PROXY  |
# +------------------+-------------------------------------+-----------------------------------+
# | DOMAIN-KEYWORD    | 域名中包含关键词即可                   | DOMAIN-KEYWORD, google, PROXY     |
# +------------------+-------------------------------------+-----------------------------------+
# | DOMAIN-SET        | 从外部规则集文件中匹配（含精确/后缀等） | DOMAIN-SET, rules.txt, PROXY      |
# +------------------+-------------------------------------+-----------------------------------+
#
# ============================================================
# 说明：
# 1. DOMAIN-SUFFIX 会匹配 google.com 以及所有子域名（如 mail.google.com）
# 2. DOMAIN 只匹配 www.google.com，不会匹配 mail.google.com
# 3. DOMAIN-KEYWORD 只要域名里包含 google 就匹配（如 content-google.com）
# 4. DOMAIN-SET 需要额外准备规则集文件，里面可混合多种匹配方式
# ============================================================
